<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Carlos Adenge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">Carlos Adenge</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>Contact Me</h1>

            <form action="#" method="post">
                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="fullname">Full Name *</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required>

                    <label for="phone">Phone (optional)</label>
                    <input type="tel" id="phone" name="phone" placeholder="+254 7XX XXX XXX">
                </fieldset>

                <fieldset>
                    <legend>Message Details</legend>

                    <label for="subject">Subject *</label>
                    <select id="subject" name="subject" required>
                        <option value="">-- Select a subject --</option>
                        <option value="general">General Inquiry</option>
                        <option value="project">Project Collaboration</option>
                        <option value="feedback">Feedback</option>
                    </select>

                    <label for="message">Message *</label>
                    <textarea id="message" name="message" rows="6" placeholder="Write your message here (minimum 50 characters)" required minlength="50"></textarea>
                </fieldset>

                <label>
                    <input type="checkbox" name="newsletter" value="yes">
                    Subscribe to my newsletter
                </label>

                <br><br>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>

            <section style="margin-top: 3rem;">
                <h2>Other Ways to Reach Me</h2>
                <address>
                    Email: <a href="mailto:carlosadenge@gmail.com">carlosadenge@gmail.com</a><br>
                    Location: Kenya<br>
                    Timezone: East Africa Time (EAT)
                </address>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Carlos Adenge. All rights reserved.</p>
            </div>
        </div>
    </footer>

</body>
</html>
